name: Windows build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch verified build tool
        shell: pwsh
        run: ./bootstrap.ps1
      - name: Build and run driver-free regression checks
        shell: pwsh
        run: ./build.ps1 -Test -UiTest
      - name: Save interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-previews
          path: artifacts/previews/*.png
          if-no-files-found: ignore
